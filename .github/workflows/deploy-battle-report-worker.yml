name: Deploy Battle Report Worker

on:
  push:
    branches:
      - feat/standalone-battle-report-worker
    paths:
      - "battle-report-worker/**"
      - ".github/workflows/deploy-battle-report-worker.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battle-report-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BATTLE_REPORT_ADMIN_TOKEN: ${{ secrets.BATTLE_REPORT_ADMIN_TOKEN }}
      REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$BATTLE_REPORT_ADMIN_TOKEN" || { echo "Missing BATTLE_REPORT_ADMIN_TOKEN"; exit 1; }

      - name: Install dependencies
        run: npm install

      - name: Ensure D1 database
        id: d1
        run: |
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8')); const a=Array.isArray(x)?x:(x.result||x.databases||[]); const d=a.find(v=>v.name==='battle-report-db'); if(d) process.stdout.write(d.uuid||d.id||d.database_id||'');")"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create battle-report-db --location weur
            npx wrangler d1 list --json > /tmp/d1.json
            DB_ID="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8')); const a=Array.isArray(x)?x:(x.result||x.databases||[]); const d=a.find(v=>v.name==='battle-report-db'); if(d) process.stdout.write(d.uuid||d.id||d.database_id||'');")"
          fi
          test -n "$DB_ID" || { echo "Could not resolve D1 database id"; exit 1; }
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Prepare production config
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'wrangler.jsonc';
          const c = JSON.parse(fs.readFileSync(p, 'utf8'));
          c.d1_databases[0].database_id = process.env.DB_ID;
          c.vars.REPORT_FROM_EMAIL = process.env.REPORT_FROM_EMAIL || '';
          c.vars.ADMIN_EMAIL = process.env.ADMIN_EMAIL || '';
          fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          NODE

      - name: Initialize D1 schema
        run: npx wrangler d1 execute battle-report-db --remote --file=./schema.sql --yes

      - name: Deploy Worker
        run: npx wrangler deploy | tee /tmp/deploy-output.txt

      - name: Set admin API secret
        run: printf '%s' "$BATTLE_REPORT_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Deployment summary
        run: |
          echo "## 战斗 Report deployed" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/deploy-output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Delete deployment branch after success
        working-directory: .
        run: git push origin --delete "${GITHUB_REF_NAME}"
